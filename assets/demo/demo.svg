<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300">
  <image href="https://raw.githubusercontent.com/Symphon-y/preview.nvim/master/assets/demo/demo-small.gif"
         width="500" height="300">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="6s" fill="freeze"/>
  </image>
  <image href="https://raw.githubusercontent.com/Symphon-y/preview.nvim/master/assets/demo/demo.gif"
         width="500" height="300" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.85;1" dur="6s" fill="freeze"/>
  </image>
</svg>
